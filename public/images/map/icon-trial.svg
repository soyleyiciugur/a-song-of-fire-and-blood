<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <g stroke="#c9a227" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Central beam top-to-bottom -->
    <line x1="16" y1="5" x2="16" y2="27" />
    <!-- Horizontal crossbar -->
    <line x1="8" y1="10" x2="24" y2="10" />
    <!-- Left chain -->
    <line x1="8" y1="10" x2="8" y2="17" />
    <!-- Right chain -->
    <line x1="24" y1="10" x2="24" y2="17" />
    <!-- Left pan -->
    <path d="M4 17 Q8 21 12 17" />
    <!-- Right pan (slightly lower — unbalanced, post-verdict tension) -->
